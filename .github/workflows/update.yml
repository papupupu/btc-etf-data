name: update-etf-data
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install httpx beautifulsoup4

      - name: Fetch upstream data
        run: python fetch.py

      - name: Commit data
        run: |
          git config user.name "etf-data-bot"
          git config user.email "etf-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data update $(date -u +'%F %T')Z"
            git push
          fi
